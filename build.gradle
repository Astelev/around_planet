plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

// DH API is compile-only; optional mods are never bundled or installed into the normal runtime.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    sableCompileBundle
}
// Exact optional API and its nested compile-time libraries; nothing is bundled in our JAR.
var extractSableApi = tasks.register('extractSableApi', Sync) {
    from({ zipTree(configurations.sableCompileBundle.singleFile) }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('sable-compile-api')
}

dependencies {
    sableCompileBundle('maven.modrinth:sable:fg9dTRz9') { transitive = false }
    compileOnly('maven.modrinth:sable:fg9dTRz9') { transitive = false }
    compileOnly files(extractSableApi.map { it.destinationDir }).asFileTree.matching { include '*.jar' }
    compileOnly('maven.modrinth:distanthorizons:9w34y8ai') { transitive = false } // DH 3.3.3 / 1.21.1
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (providers.gradleProperty('compatModsDir').isPresent()) {
        localRuntime fileTree(dir: providers.gradleProperty('compatModsDir').get(), include: ['*.jar'])
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
    repositories { maven { url = layout.projectDirectory.dir('repo').asFile.toURI() } }
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}

tasks.named('test', Test).configure { useJUnitPlatform() }

// Real-server regression harness, excluded from production artifacts.
if (providers.gradleProperty('planetTests').isPresent()) {
    sourceSets {
        planetTests {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    neoForge.mods.named(mod_id) { sourceSet(sourceSets.planetTests) }
    neoForge.runs {
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }
}

if (providers.gradleProperty('planetClientSmoke').isPresent()) {
    sourceSets {
        planetClientSmoke {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    neoForge.mods.named(mod_id) { sourceSet(sourceSets.planetClientSmoke) }
    neoForge.runs.named('client') {
        programArguments.addAll('--quickPlaySingleplayer', providers.gradleProperty('quickPlayWorld').getOrElse('around-ew-smoke'))
        jvmArguments.add('-Xmx3G')
        if (providers.gradleProperty('planetProgressiveTerrainSmoke').isPresent()) jvmArguments.add('-Daround_planet.progressiveTerrainSmoke=true')
        if (providers.gradleProperty('planetProgressiveSmoke').isPresent() || providers.gradleProperty('planetProgressiveTerrainSmoke').isPresent()) jvmArguments.add('-Daround_planet.progressiveSmoke=true')
        if (providers.gradleProperty('planetDiagnosticSmoke').isPresent()) jvmArguments.add('-Daround_planet.diagnosticSmoke=true')
        if (providers.gradleProperty('planetGenerationSmoke').isPresent()) jvmArguments.add('-Daround_planet.generationSmoke=true')
        if (providers.gradleProperty('planetSeatTransferSmoke').isPresent()) jvmArguments.addAll('-Daround_planet.seatTransferSmoke=true','-Daround_planet.traceShipTransfers=true')
        if (providers.gradleProperty('planetShipTransferSmoke').isPresent()) jvmArguments.addAll('-Daround_planet.shipTransferSmoke=true','-Daround_planet.traceShipTransfers=true')
        if (providers.gradleProperty('planetShipSmoke').isPresent()) jvmArguments.add('-Daround_planet.shipSmoke=true')
        if (providers.gradleProperty('planetCollisionSmoke').isPresent()) jvmArguments.add('-Daround_planet.collisionSmoke=true')
        if (providers.gradleProperty('planetArrivalSmoke').isPresent()) jvmArguments.add('-Daround_planet.arrivalSmoke=true')
        if (providers.gradleProperty('planetLightSmoke').isPresent()) jvmArguments.add('-Daround_planet.lightSmoke=true')
        if (providers.gradleProperty('planetVisualSmoke').isPresent()) jvmArguments.add('-Daround_planet.visualSmoke=true')
        if (providers.gradleProperty('planetEntitySmoke').isPresent()) jvmArguments.add('-Daround_planet.entitySmoke=true')
    }
}

tasks.named('compileJava') { dependsOn extractSableApi }
