plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

// Local compatibility checks only; no external mods are compiled against or bundled.
configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (providers.gradleProperty('compatModsDir').isPresent()) {
        localRuntime fileTree(dir: providers.gradleProperty('compatModsDir').get(), include: ['*.jar'])
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
    repositories { maven { url = layout.projectDirectory.dir('repo').asFile.toURI() } }
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}

tasks.named('test', Test).configure { useJUnitPlatform() }

// Real-server regression harness, excluded from production artifacts.
if (providers.gradleProperty('planetTests').isPresent()) {
    sourceSets {
        planetTests {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
        }
    }
    neoForge.mods.named(mod_id) { sourceSet(sourceSets.planetTests) }
    neoForge.runs {
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }
}

if (providers.gradleProperty('planetClientSmoke').isPresent()) {
    sourceSets {
        planetClientSmoke {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
        }
    }
    neoForge.mods.named(mod_id) { sourceSet(sourceSets.planetClientSmoke) }
    neoForge.runs.named('client') {
        programArguments.addAll('--quickPlaySingleplayer', 'around-ew-smoke')
        jvmArguments.add('-Xmx3G')
    }
}
