modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Configurable east/west global portals powered by Immersive Aeronautics.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[mixins]]
config="around_planet.mixins.json"

[[dependencies.${mod_id}]]
modId="immersive_portals_core"
type="required"
versionRange="[6.0.7]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cloth_config"
type="required"
versionRange="[15.0.140,16)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="[6.0,7)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="distanthorizons"
type="optional"
versionRange="[3.3.3]"
ordering="AFTER"
side="BOTH"
